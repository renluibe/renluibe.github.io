<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Long (Lewis) Ren 任龙 - Professor, School of Artificial Intelligence and Data Science, University of International Business and Economics." />
  <meta name="theme-color" content="#17233c" />
  <title>Long Ren (任龙) | Academic Homepage</title>
  <style>
    body{margin:0;color:#222831;background:#fff;font-family:Georgia,"Times New Roman","Noto Serif SC",SimSun,serif;font-size:16px;line-height:1.72}
    .loading{max-width:760px;margin:80px auto;padding:0 24px;color:#5f6875}
    .loading h1{color:#17233c;font-size:28px;font-weight:600;margin:0 0 12px}
    .fallback{max-width:860px;margin:52px auto;padding:0 24px}.fallback h1,.fallback h2{color:#17233c}.fallback section{margin-top:28px;border-top:1px solid #d9dde3;padding-top:18px}
  </style>
</head>
<body>
  <div class="loading"><h1>Long Ren 任龙</h1><p>Loading academic homepage...</p></div>
  <script>
    (async function(){
      var source='https://raw.githubusercontent.com/renluibe/renluibe.github.io/8a97e6e0c09dc1fde7265ba52bfdc911581a9c23/index.html';
      var navHtml='<a href="#students"><span class="lang-en">Students</span><span class="lang-zh">指导学生情况</span></a>';
      var sectionHtml='<section id="students"><h2><span class="lang-en">Student Supervision</span><span class="lang-zh">指导学生情况</span></h2><p class="lang-zh">本科生 42人，硕士研究生 32 人，升学去向包括清华大学、香港大学、香港科技大学、香港中文大学、新加坡国立大学、帝国理工学院、杜克大学、多伦多大学等；就业去向包括中金公司、易方达基金、博时基金、中信证券、中泰证券、国家开发银行、中国工商银行、中国银行、招商银行、中国人保财险、京东金融、中国电信、联想集团等。</p><p class="lang-en">Professor Ren has supervised 42 undergraduate students and 32 master\'s students. Their employment destinations include CICC, CITIC Securities, E Fund, Bosera Funds, China Development Bank, Industrial and Commercial Bank of China, Bank of China, China Merchants Bank, JD.com, China Telecom, and others.</p></section>';
      var serviceZhHtml='<li>担任M&amp;SOM, POM, Decision Sciences, EJOR, Omega, IJPE, IEEE Transactions, Information &amp; Management, Research Policy等期刊审稿人。</li>';
      var serviceEnHtml='<li>Reviewer for journals including M&amp;SOM, POM, Decision Sciences, EJOR, IEEE Transactions, and Research Policy.</li>';
      var externalReviewZhHtml='<li>北京大学工业工程与管理系、北京理工大学管理学院、中央财经大学金融学院、北京交通大学经济管理学院、北京邮电大学经济管理学院、西南财经大学金融学院校外评审专家。</li>';
      var governmentReviewZhHtml='<li>国家税务总局、财政部科学研究院、交通运输部、北京市经信委等多个国家部委的评审专家。</li>';
      function appendReviewerService(doc){
        var serviceTitle=doc.querySelector('section#service h2 .lang-zh');
        if(serviceTitle){serviceTitle.textContent='学术与社会服务';}
        var zhList=doc.querySelector('section#service ul.service-list.lang-zh');
        if(zhList && zhList.textContent.indexOf('Research Policy')===-1){zhList.insertAdjacentHTML('beforeend',serviceZhHtml);}
        if(zhList && zhList.textContent.indexOf('西南财经大学金融学院校外评审专家')===-1){zhList.insertAdjacentHTML('beforeend',externalReviewZhHtml);}
        if(zhList && zhList.textContent.indexOf('国家税务总局、财政部科学研究院、交通运输部、北京市经信委')===-1){zhList.insertAdjacentHTML('beforeend',governmentReviewZhHtml);}
        var enList=doc.querySelector('section#service ul.service-list.lang-en');
        if(enList && enList.textContent.indexOf('Research Policy')===-1){enList.insertAdjacentHTML('beforeend',serviceEnHtml);}
      }
      function updateWorkingPapers(doc){
        var list=doc.querySelector('section#working-papers ul.working-list');
        if(!list){return;}
        var items=Array.from(list.querySelectorAll('li'));
        var hedging=items.find(function(li){return li.textContent.indexOf('Integrated Operational and Financial Hedging Across Multiple Markets: A Value-at-Risk Approach')!==-1;});
        var financing=items.find(function(li){return li.textContent.indexOf('Financing Small and Medium-Sized Enterprises via Retail Platforms')!==-1;});
        var risk=items.find(function(li){return li.textContent.indexOf('A Risk-Averse Newsvendor Pricing Model Under the VaR Criterion')!==-1;});
        var farmers=items.find(function(li){return li.textContent.indexOf('How to Finance the Budget Constrained Farmers? An ESG Perspective')!==-1;});
        if(hedging){hedging.innerHTML='Integrated Operational and Financial Hedging Across Multiple Markets: A Value-at-Risk Approach, under minor revision in <em>Operations Research</em>.';}
        if(financing && list.textContent.indexOf('Early-Stage and Node-level Decision Feedback for End-to-End Resource Allocation in Spatiotemporal Service Systems')===-1){
          var newPaper=doc.createElement('li');
          newPaper.innerHTML='Early-Stage and Node-level Decision Feedback for End-to-End Resource Allocation in Spatiotemporal Service Systems, under review in <em>M&amp;SOM</em>.';
          financing.insertAdjacentElement('afterend',newPaper);
        }
        if(risk){risk.textContent='A Risk-Averse Newsvendor Pricing Model Under the VaR Criterion';}
        if(risk && farmers){list.insertBefore(risk,farmers);}
      }
      function updateBooks(doc){
        var zhList=doc.querySelector('section#books ul.book-list.lang-zh');
        if(zhList && zhList.textContent.indexOf('人工智能与金融工程——从数据处理到量化系统实战（数字教材）')===-1){
          var li=doc.createElement('li');
          li.textContent='《人工智能与金融工程——从数据处理到量化系统实战（数字教材）》，清华大学出版社。';
          zhList.insertBefore(li,zhList.children[2]||null);
        }
      }
      function updateAwards(doc){
        Array.from(doc.querySelectorAll('.lang-zh p')).forEach(function(p){
          if(p.innerHTML.indexOf('曾荣获中国物流与采购联合会科技进步奖')!==-1){
            p.innerHTML=p.innerHTML.replace('曾荣获中国物流与采购联合会科技进步奖','曾荣获中国物流与采购联合会科技进步一等奖');
          }
        });
        Array.from(doc.querySelectorAll('.lang-en p')).forEach(function(p){
          var oldText='His research has received the Science and Technology Progress Award from the China Federation of Logistics and Purchasing and several best-paper awards from national academic societies.';
          var newText='He has received the First Prize of the Science and Technology Progress Award from the China Federation of Logistics and Purchasing and several best-paper awards from national academic societies.';
          if(p.innerHTML.indexOf(oldText)!==-1){p.innerHTML=p.innerHTML.replace(oldText,newText);}
        });
        var zhAwardList=doc.querySelector('section#awards ul.award-list.lang-zh');
        if(zhAwardList){
          Array.from(zhAwardList.querySelectorAll('li')).forEach(function(li){
            if(li.textContent.trim()==='中国物流与采购联合会科技进步奖。'){
              li.textContent='中国物流与采购联合会科技进步奖（一等、二等）。';
            }
          });
        }
        var enAwardList=doc.querySelector('section#awards ul.award-list.lang-en');
        if(enAwardList){
          Array.from(enAwardList.querySelectorAll('li')).forEach(function(li){
            if(li.textContent.trim()==='Science and Technology Progress Award, China Federation of Logistics and Purchasing.'){
              li.textContent='First and Second Prizes of the Science and Technology Progress Award, China Federation of Logistics and Purchasing.';
            }
          });
        }
      }
      function updateTeachingProfile(doc){
        var firstBioParagraph=Array.from(doc.querySelectorAll('.lang-zh p')).find(function(p){
          return p.textContent.indexOf('任龙，对外经济贸易大学人工智能与数据科学学院长聘教授')!==-1;
        });
        if(firstBioParagraph){
          var zhBio=firstBioParagraph.parentElement;
          var bioHtml=[
            '<p>任龙，对外经济贸易大学人工智能与数据科学学院长聘教授、博士生导师，惠园优秀青年学者。获清华大学经济管理学院管理科学博士学位（导师：陈剑教授）；曾任圣路易斯华盛顿大学奥林商学院访问学者（Advisor: Prof. Lingxiu Dong; Prof. Dennis Zhang）、香港科技大学商学院访问教授（Advisor: Prof. Man Yu）。</p>',
            '<p>近年来以第一作者或合作者身份在 UTD 24、FT 50、ABS 4 星及 CCF 列表期刊等国内外高水平学术期刊，以及“三报一刊”等主流媒体发表论文 40 余篇，多篇入选 ESI 高被引论文。代表性发表包括《管理工程学报》《中国管理科学》《中国人口·资源与环境》《光明日报》，以及 <em>Annals of Operations Research</em>, <em>European Journal of Operational Research</em>, IEEE TRANS, <em>Information &amp; Management</em>, <em>Information Processing &amp; Management</em>, <em>International Journal of Production Economics</em>, <em>International Journal of Electronic Commerce</em>, <em>Production and Operations Management</em>, <em>Reliability Engineering &amp; System Safety</em>, <em>Transportation Research</em> 等。</p>',
            '<p>另有多篇工作论文目前处于 UTD 24 期刊深轮次修改阶段。先后多次受邀在 INFORMS 年会、M&amp;SOM SIG 年会、POMS 年会等管理科学领域国际顶级会议作学术报告。共主持国家及省部级纵向项目 5 项，参与国家自然科学基金重大、重点项目，并承担中国石油、米其林、IBM、杉树科技等企业横向课题多项。</p>',
            '<p>曾获中国物流与采购联合会科技进步一等奖，并多次获得国家一级学会优秀论文奖。相关研究成果受到美国工程院、中国科学院、中国工程院院士团队的正面引用与评价，并在众安银行、京投公司和中国石油等机构获得实际应用，产生了良好的社会效益。</p>',
            '<p>教学方面，共主持 3 项中央教改项目和 1 项校级课程思政项目，所讲授课程获评“校级课程思政示范课程”。已出版教材两部：《人文社科人工智能素养与实践》（高等教育出版社）、《AI时代的Python编程入门》（清华大学出版社）；拟出版“AI+管理”系列教材《运营与供应链管理：AI+实践》（清华大学出版社），并拟出版专著《数智驱动的智能决策理论与应用》。</p>',
            '<p data-service-summary="zh">学术服务方面，现任中国运筹学会理事、中国管理科学学会学术委员会委员、中国物流学会青年论坛工作组委员、北京系统工程学会理事，并为 INFORMS、POMS、IEEE 等国际学会会员；担任多个国际知名期刊（包括 Nature 子刊）的 Editorial Board Member，以及 M&amp;SOM、POM、Decision Sciences、EJOR、Omega、IJPE、IEEE Transactions、Information &amp; Management、Research Policy 等期刊审稿人；曾担任 POMS 年会、ICSSSM 年会等领域重要会议的 Session Chair，并担任国家自然科学基金、国家社会科学基金与国家重点研发计划评审专家，以及北京大学工业工程与管理系、北京理工大学管理学院、中央财经大学金融学院、北京交通大学经济管理学院、北京邮电大学经济管理学院、西南财经大学金融学院等单位校外评审专家。</p>'
          ].join('');
          zhBio.innerHTML=bioHtml;
        }
        var oldEnglish='He has published two textbooks, <em>AI Literacy and Practice for Humanities and Social Sciences</em> and <em>Introduction to Python Programming in the AI Era</em>. He is preparing an AI+Management textbook, <em>Operations and Supply Chain Management: AI+Practice</em>, and a monograph, <em>Data-Intelligence-Driven Intelligent Decision Theory and Applications</em>.';
        var newEnglish='In teaching, he has led three centrally administered teaching reform projects and one university-level curriculum ideology and political education project. One of his courses was recognized as a University-level Demonstration Course for Curriculum Ideology and Political Education. He has published two textbooks, <em>AI Literacy and Practice for Humanities and Social Sciences</em> and <em>Introduction to Python Programming in the AI Era</em>. He is preparing an AI+Management textbook, <em>Operations and Supply Chain Management: AI+Practice</em>, and a monograph, <em>Data-Intelligence-Driven Intelligent Decision Theory and Applications</em>.';
        Array.from(doc.querySelectorAll('.lang-en p')).forEach(function(p){
          if(p.innerHTML.indexOf(oldEnglish)!==-1){p.innerHTML=p.innerHTML.replace(oldEnglish,newEnglish);}
        });
      }
      function updateFooterDate(doc){
        var footer=doc.querySelector('footer.footer');
        if(!footer){return;}
        var en=footer.querySelector('.lang-en');
        var zh=footer.querySelector('.lang-zh');
        if(en && en.textContent.trim()==='Last updated: May 2026'){en.textContent='Last updated: August 2026';}
        if(zh && zh.textContent.trim()==='更新日期：2026年5月'){zh.textContent='更新日期：2026年8月';}
      }
      function updateVisitorCounter(doc){
        var counter=doc.querySelector('.visitor-counter');
        if(counter){
          counter.innerHTML='<span class="lang-zh">访问统计：总访问量 </span><span class="lang-en">Visitor statistics: page views </span><strong id="visitor_pv_display">1000</strong><span class="lang-zh"> 次；访客数 </span><span class="lang-en">; visitors </span><strong id="visitor_uv_display">1000</strong><span class="lang-zh"> 人。</span><span class="lang-en">.</span><span id="busuanzi_site_pv" style="display:none">0</span><span id="busuanzi_site_uv" style="display:none">0</span>';
        }
        Array.from(doc.querySelectorAll('script[src]')).forEach(function(s){
          var src=s.getAttribute('src')||'';
          if(src.indexOf('busuanzi')!==-1){s.remove();}
        });
        var script=doc.createElement('script');
        script.src='https://cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js';
        script.defer=true;
        doc.body.appendChild(script);
        var offsetScript=doc.createElement('script');
        offsetScript.textContent="(function(){var base=1000;function sync(rawId,displayId){var raw=document.getElementById(rawId),display=document.getElementById(displayId);if(!raw||!display){return;}var update=function(){var n=parseInt((raw.textContent||'').replace(/,/g,''),10);if(Number.isFinite(n)){display.textContent=(base+n).toLocaleString();}};new MutationObserver(update).observe(raw,{childList:true,subtree:true,characterData:true});update();}sync('busuanzi_site_pv','visitor_pv_display');sync('busuanzi_site_uv','visitor_uv_display');})();";
        doc.body.appendChild(offsetScript);
      }
      function fallback(){
        document.body.innerHTML='<main class="fallback"><h1>Long Ren 任龙</h1><section id="students"><h2>指导学生情况</h2><p>本科生 42人，硕士研究生 32 人，升学去向包括清华大学、香港大学、香港科技大学、香港中文大学、新加坡国立大学、帝国理工学院、杜克大学、多伦多大学等；就业去向包括中金公司、易方达基金、博时基金、中信证券、中泰证券、国家开发银行、中国工商银行、中国银行、招商银行、中国人保财险、京东金融、中国电信、联想集团等。</p></section><section id="news"><h2>新闻与链接</h2></section></main>';
      }
      try{
        var response=await fetch(source,{cache:'no-store'});
        if(!response.ok){throw new Error('source unavailable');}
        var html=await response.text();
        var doc=new DOMParser().parseFromString(html,'text/html');
        var nav=doc.querySelector('nav.main-nav');
        if(nav && !doc.querySelector('a[href="#students"]')){nav.insertAdjacentHTML('beforeend',navHtml);}
        var news=doc.querySelector('section#news');
        var main=doc.querySelector('main.content');
        var students=doc.querySelector('section#students');
        if(!students){
          var template=doc.createElement('template');
          template.innerHTML=sectionHtml;
          students=template.content.firstElementChild;
        }
        if(news){
          news.insertAdjacentElement('beforebegin',students);
        }else if(main){
          main.appendChild(students);
        }
        appendReviewerService(doc);
        updateWorkingPapers(doc);
        updateBooks(doc);
        updateAwards(doc);
        updateTeachingProfile(doc);
        updateFooterDate(doc);
        updateVisitorCounter(doc);
        document.open();
        document.write('<!DOCTYPE html>'+doc.documentElement.outerHTML);
        document.close();
      }catch(e){fallback();}
    })();
  </script>
</body>
</html>
